name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun test

  no-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test test/no-egress.test.ts

  node-smoke:
    strategy:
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install
      - run: bun run build
      - run: npm pack
      - name: Install and smoke test
        run: |
          mkdir /tmp/smoke
          cd /tmp/smoke
          npm init -y
          npm install ${{ github.workspace }}/emetlabs-trace-grab-*.tgz
          npx trace-grab grab ${{ github.workspace }}/test/fixtures/fixture-100.jsonl --out /tmp/corpus-smoke
          test -f /tmp/corpus-smoke/corpus.jsonl
          test -f /tmp/corpus-smoke/manifest.json
