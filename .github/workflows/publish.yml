name: publish

# Continuous deployment for the npm package.
# Fires when a version tag `v*` is pushed (e.g. `git tag v0.1.1 && git push origin v0.1.1`)
# or on manual dispatch. Publishes to the `@emetlabs` scope with npm provenance
# (SLSA build attestations tied to this workflow run + commit).
#
# Re-publishing an existing version fails (npm rejects it), so bump `version`
# in package.json before tagging. Do not retag a released version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub Release
  id-token: write # required to mint the OIDC token for npm provenance

jobs:
  publish:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run build
      - run: bun test

      # npm (not bun) is required: provenance is an npm feature.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Pack tarball for release asset
        run: npm pack

      - name: Create GitHub Release
        # Only on tag pushes (manual dispatch has no tag to release).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: emetlabs-trace-grab-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
