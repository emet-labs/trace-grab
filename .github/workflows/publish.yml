name: publish

# Continuous deployment: publishes @emetlabs/trace-grab to npm via OIDC
# trusted publishing (no npm token secret — npm mints the publish credential
# from GitHub's OIDC token, once this repo+workflow are registered as a
# trusted publisher on npmjs.com) with SLSA provenance, then cuts a GitHub
# Release with the published tarball attached.
#
# Trigger: push a version tag `v*` (e.g. `git tag v0.1.1 && git push origin v0.1.1`)
# or manual dispatch. Bump `version` in package.json before tagging — npm rejects
# re-publishing an existing version. Do not retag a released version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test

      # npm (not bun) is required: trusted publishing + provenance are npm
      # features. setup-node@v6 with registry-url and no NODE_AUTH_TOKEN lets
      # `npm publish` authenticate via the GitHub OIDC token exchange.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      - name: Publish with provenance
        run: npm publish --provenance

      - name: Pack tarball for release asset
        run: npm pack

      - name: Create GitHub release
        # Only on tag pushes (manual dispatch has no tag to release).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: emetlabs-trace-grab-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
